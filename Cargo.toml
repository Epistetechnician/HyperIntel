[workspace]
resolver = "3"
members = [
  "crates/hyperintel-core",
  "crates/hyperintel-assurance",
  "crates/hyperintel-market",
  "crates/hyperintel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false

[workspace.dependencies]
data-encoding = "=2.11.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
proptest = "=1.11.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.0"
subtle = "=2.6.1"
thiserror = "=2.0.18"
time = { version = "=0.3.53", default-features = false, features = ["formatting", "parsing"] }
unicode-normalization = "=0.1.25"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
