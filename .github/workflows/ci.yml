name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --skip contract_policy_non_widening
  formal:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - run: pip install z3-solver==4.15.0.0
      - run: |
          export HYPERINTEL_Z3="$(python3 -c 'import os,z3;print(os.path.join(os.path.dirname(z3.__file__),"bin","z3"))')"
          cargo test -p hyperintel-market --test formal_policy
